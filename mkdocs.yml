site_name: Starynight | 个人博客
site_description: 模拟/混合信号芯片设计工程师 · 深度学习爱好者 · 计算机体系结构探索者
site_author: Starynight (defineiocc02)
site_url: https://defineiocc02.github.io/Blog/

repo_name: defineiocc02/Blog
repo_url: https://github.com/defineiocc02/Blog

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到月光森林
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到阳光森林
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/leaf
    favicon: material/leaf

extra_css:
  - assets/css/ghibli.css

extra_javascript:
  - assets/js/ghibli.js

nav:
  - 🏠 主页: index.md
  - 📄 简历: resume.md
  - 🚀 项目: projects.md
  - 🛠️ 技能: skills.md
  - 📝 笔记: blog/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/defineiocc02

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

copyright: Copyright &copy; 2026 Starynight · 🌿 像风一样自由
